services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: learningres-frontend:latest
    container_name: learningres-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - learning_app_net

networks:
  learning_app_net:
    name: learning_app_net
    external: true